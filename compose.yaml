services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cloudops-lab:step-05
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - APP_NAME=CloudOps Lab App
      - APP_VERSION=1.0.0
      - APP_ENV=production
      - LOG_LEVEL=INFO
      - PORT=8000
    restart: unless-stopped
